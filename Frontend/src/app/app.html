<div class="min-h-screen bg-slate-50 flex flex-col">

  <!-- Toolbar Principal com Angular Material -->
  <mat-toolbar color="primary" class="flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <mat-icon>account_balance</mat-icon>
      <div class="flex flex-col">
        <span class="text-base font-bold leading-none">SIPO — IFSP Campus Jacareí</span>
        <span class="text-xs text-slate-200 font-normal leading-tight">Portal Transparente de Gestão Orçamentária</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <mat-chip borderless color="accent">
        <mat-icon matChipAvatar>check_circle</mat-icon>
        Dados 2025 Sincronizados
      </mat-chip>
    </div>
  </mat-toolbar>

  <!-- Conteúdo do Dashboard com Abas Angular Material -->
  <main class="max-w-7xl mx-auto w-full p-6 flex flex-col gap-6">
    <mat-tab-group animationDuration="200ms" class="bg-white rounded-lg shadow-sm border border-slate-200 p-2">
      
      <!-- Aba 1: Painel de Execução -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">analytics</mat-icon>
          Painel de Execução
        </ng-template>
        <div class="pt-6">
          <app-painel-execucao></app-painel-execucao>
        </div>
      </mat-tab>

      <!-- Aba 2: Assistência Estudantil -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">school</mat-icon>
          Assistência Estudantil
        </ng-template>
        <div class="pt-6">
          <app-destinacao-estudantil></app-destinacao-estudantil>
        </div>
      </mat-tab>

      <!-- Aba 3: Gestão de Fornecedores -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">store</mat-icon>
          Gestão de Fornecedores
        </ng-template>
        <div class="pt-6">
          <app-gestao-fornecedores></app-gestao-fornecedores>
        </div>
      </mat-tab>

    </mat-tab-group>
  </main>

</div>
