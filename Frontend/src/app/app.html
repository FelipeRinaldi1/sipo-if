<div class="min-h-screen bg-gray-50 flex flex-col w-full max-w-full overflow-x-hidden box-border">

  <!-- Header Superior Institucional (Verde Oficial IFSP #2F9E41) -->
  <header class="bg-[#2F9E41] text-white shadow-lg flex flex-col md:flex-row justify-between items-stretch md:items-center px-4 sm:px-6 py-4 gap-4 border-b-4 border-[#CD191E] w-full box-border">
    
    <!-- Marca SIPO-IF e Identificação Institucional -->
    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="w-10 h-10 sm:w-11 sm:h-11 bg-[#CD191E] rounded-lg flex items-center justify-center shadow-inner border border-white/20 shrink-0">
        <mat-icon class="text-white">account_balance</mat-icon>
      </div>
      <div class="flex flex-col min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xl sm:text-2xl font-black tracking-wider text-white">SIPO-IF</span>
          <span class="text-[10px] sm:text-xs bg-white text-[#2F9E41] px-2 py-0.5 rounded-full font-bold shadow-sm whitespace-nowrap">Campus Jacareí</span>
        </div>
        <span class="text-[11px] sm:text-xs text-emerald-100 font-medium truncate">Sistema Integrado de Planejamento e Orçamento</span>
      </div>
    </div>

    <!-- Módulos de Navegação (Chips neutros sem excesso de cor) -->
    <nav class="flex items-center gap-2 overflow-x-auto whitespace-nowrap pb-2 md:pb-0 scrollbar-none w-full md:w-auto max-w-full">
      
      <!-- Área 1: Execução SIAFI/Gov (Ativo - Vermelho IFSP) -->
      <button mat-flat-button class="!bg-[#CD191E] !text-white flex items-center gap-1 font-bold text-xs sm:text-sm shrink-0" routerLink="/">
        <mat-icon class="!w-4 !h-4 text-base">analytics</mat-icon>
        Execução Orçamentária (Gov)
      </button>

      <!-- Área 2: Distribuição Interna DAA (Em Breve - Neutro) -->
      <button mat-button class="text-white hover:bg-white/10 flex items-center gap-1 opacity-80 text-xs sm:text-sm shrink-0" matTooltip="Distribuição Orçamentária Interna pelos Setores">
        <mat-icon class="!w-4 !h-4 text-base">pie_chart</mat-icon>
        Distribuição DAA
        <span class="ml-1 text-[9px] bg-white/20 text-white font-medium px-1.5 py-0.5 rounded border border-white/30">Em Breve</span>
      </button>

      <!-- Área 3: Relatórios e Prestação de Contas DAA (Em Breve - Neutro) -->
      <button mat-button class="text-white hover:bg-white/10 flex items-center gap-1 opacity-80 text-xs sm:text-sm shrink-0" matTooltip="Notas Oficiais e Relatórios de Gestão da Equipe DAA">
        <mat-icon class="!w-4 !h-4 text-base">description</mat-icon>
        Prestação de Contas
        <span class="ml-1 text-[9px] bg-white/20 text-white font-medium px-1.5 py-0.5 rounded border border-white/30">Em Breve</span>
      </button>

    </nav>
  </header>

  <!-- Sub-barra de Metadados e LAI -->
  <div class="bg-[#247b33] text-emerald-50 px-4 sm:px-6 py-2 text-xs flex justify-between items-center border-b border-black/10 w-full max-w-full box-border">
    <div class="flex items-center gap-2 min-w-0">
      <mat-icon class="text-xs w-4 h-4 leading-none shrink-0">account_tree</mat-icon>
      <span class="truncate">UG: <strong>158716 (IFSP - Jacareí)</strong></span>
    </div>
    <div class="hidden md:flex items-center gap-4 shrink-0">
      <span>Portal Público de Acesso Livre</span>
      <span>•</span>
      <span>Base Legal: LAI (Lei nº 12.527)</span>
    </div>
  </div>

  <!-- Área de Conteúdo da Aplicação -->
  <main class="flex-1 p-3 sm:p-6 w-full max-w-7xl mx-auto box-border min-w-0">
    <router-outlet></router-outlet>
  </main>

  <!-- Rodapé Institucional -->
  <footer class="bg-white border-t-2 border-[#2F9E41] py-4 px-4 sm:px-6 text-center text-xs text-gray-600 flex flex-col sm:flex-row justify-between items-center gap-2 w-full max-w-full box-border">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-[#2F9E41] inline-block"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-[#CD191E] inline-block"></span>
      <span>© 2026 Instituto Federal de São Paulo — Campus Jacareí</span>
    </div>
    <span>SIPO-IF v1.0.0</span>
  </footer>

</div>
