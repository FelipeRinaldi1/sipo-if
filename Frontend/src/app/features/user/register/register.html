<div
  class="flex items-center justify-center min-h-screen p-4 bg-(--mat-sys-surface-container-lowest)"
>
  <mat-card class="w-full max-w-110 p-6 flex flex-col gap-4">
    <mat-card-header>
      <mat-card-title> Criar Conta</mat-card-title>
      <mat-card-subtitle>Preencha os dados abaixo para se cadastrar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="flex flex-col gap-4">
      <mat-form-field class="w-full" appearance="outline">
        <mat-label> Nome </mat-label>
        <input matInput type="name" placeholder="Meu Nome" required />
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label> Email </mat-label>
        <input matInput type="email" placeholder="pat@example.com" required />
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label> Senha </mat-label>
        <input matInput type="password" placeholder="******" required />
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label> Repetir Senha </mat-label>
        <input matInput type="password" placeholder="******" required />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button color="primary" class="w-full h-11">Registrar-se</button>
    </mat-card-actions>
  </mat-card>
</div>
